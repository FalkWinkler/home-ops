---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-mail-sync
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-mail-sync-secret
    creationPolicy: Owner
    template:
      data:
        # Token of an existing paperless user; reused from the AI item so no
        # second token has to be maintained.
        PAPERLESS_API_TOKEN: "{{ .ai_api_token }}"
        MAIL_USERNAME: "{{ .mail_username }}"
        MAIL_PASSWORD: "{{ .mail_password }}"
  data:
    - secretKey: ai_api_token
      remoteRef:
        key: paperless-ai
        property: api_token
    - secretKey: mail_username
      remoteRef:
        key: paperless
        property: mail_username
    - secretKey: mail_password
      remoteRef:
        key: paperless
        property: mail_password
