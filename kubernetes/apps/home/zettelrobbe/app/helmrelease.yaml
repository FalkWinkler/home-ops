---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zettelrobbe
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      zettelrobbe:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        containers:
          app:
            image:
              repository: docker.io/admonstrator/zettelrobbe
              tag: v2026.08.05
            env:
              PUID: "1000"
              PGID: "1000"
              PAPERLESS_AI_PORT: "3000"
              LOG_LEVEL: info
              # Setup wizard is reached over the network, not from localhost
              ALLOW_REMOTE_SETUP: "yes"
              PAPERLESS_API_URL: "http://paperless-app.home.svc.cluster.local:8000"
              # Exactly one proxy hop (envoy-internal) in front of the app
              TRUST_PROXY: "1"
              # Runtime config (set in the UI) takes precedence over these defaults
              AI_PROVIDER: custom
              CUSTOM_BASE_URL: "https://openrouter.ai/api/v1"
              CUSTOM_MODEL: "anthropic/claude-haiku-4.5"
              # OCR rescue queue: re-runs documents whose text layer is poor
              # through a vision model. Off by default; enabled so the queue
              # drains on its own instead of needing a click per batch.
              OCR_AUTO_PROCESS_ENABLED: "yes"
              # 10 per run every 15 minutes would take ~16h for the current
              # backlog of ~660 documents.
              OCR_AUTO_PROCESS_BATCH_SIZE: "50"
              - secretRef:
                  name: zettelrobbe-secret
            # Deliberately TCP, not HTTP /health: with HEALTHCHECK_STRICT
            # (default yes) /health returns 503 once Paperless is unreachable,
            # which would restart the pod or pull the UI out of the route
            # exactly when it is needed to fix things.
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: zettelrobbe
        ports:
          http:
            port: &port 3000

    route:
      app:
        hostnames:
          - zettelrobbe.f-wi.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        enabled: true
        existingClaim: zettelrobbe-data
        globalMounts:
          - path: /app/data
