---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zettelrobbe
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zettelrobbe-secret
    creationPolicy: Owner
    template:
      data:
        PAPERLESS_API_TOKEN: "{{ .paperless_ai_api_token }}"
        CUSTOM_API_KEY: "{{ .paperless_ai_custom_api_key }}"
        # OCR resolves its key only from OCR_API_KEY/MISTRAL_API_KEY and never
        # falls back to CUSTOM_API_KEY, so the same OpenRouter key is set twice.
        OCR_API_KEY: "{{ .paperless_ai_custom_api_key }}"
  dataFrom:
    # Reuses the existing 1Password item; no new entry required
    - extract:
        key: paperless-ai
      rewrite:
        - regexp:
            source: "(.*)"
            target: "paperless_ai_$1"
